[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questgrow"
version = "0.6.0"
description = "QuestGrow MVP implementation stack — built strictly against docs/architecture/TECHNICAL_MODEL.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1", "psycopg_pool>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
questgrow = ["webclient/*.html", "migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
