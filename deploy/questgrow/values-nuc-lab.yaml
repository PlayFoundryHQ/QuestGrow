# Real deploy — nuc-lab cluster, questgrow.opscale.ir.
# The ArgoCD Application points valueFiles at this file.

image:
  repository: ghcr.io/playfoundryhq/questgrow
  tag: "0.6.2"

persistence:
  enabled: true
  size: 1Gi             # SQLite for a single family — a few MB in practice

config:
  databaseUrl: sqlite:///data/questgrow.db
  # personal deployment: don't nag for the PIN every 15 min
  parentTtlS: 43200            # 12h
  # the reference web clients are same-origin, so CORS can stay off
  corsOrigins: ""

ingress:
  enabled: true
  kind: ingressroute        # match the house style (downtime)
  className: traefik
  host: questgrow.opscale.ir
  tls:
    # ArvanCloud edge-terminates TLS with a *.opscale.ir wildcard cert
    # (verified: same edge IPs as downtime, Let's Encrypt CN=opscale.ir).
    # No in-cluster cert needed — Traefik's default cert on websecure is
    # fine for the ArvanCloud→origin hop.
    enabled: false

resources:
  requests: { cpu: 25m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
